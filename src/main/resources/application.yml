server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: aztu-kanban
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aztu_kanban}
    username: ${DB_USER:aztu}
    password: ${DB_PASSWORD:aztu}
    hikari:
      maximum-pool-size: 15
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: ${SHOW_SQL:false}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The SMTP probe reports DOWN whenever credentials are absent or wrong, which
    # would fail the container healthcheck even though the API is perfectly fine.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-development-only-secret-key-0123456789}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    issuer: aztu-kanban
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@aztu.edu.az}
    from-name: ${MAIL_FROM_NAME:AzTU Kanban}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@aztu.edu.az}
    password: ${ADMIN_PASSWORD:Admin123!}
    full-name: ${ADMIN_FULL_NAME:AzTU Administrator}
  seed:
    demo-data: ${SEED_DEMO_DATA:true}
  reminders:
    cron: ${REMINDERS_CRON:0 0 8 * * *}

logging:
  level:
    root: INFO
    az.aztu.kanban: ${LOG_LEVEL:INFO}

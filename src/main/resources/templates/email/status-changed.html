<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>AzTU Kanban</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 12px;">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,.08);">
      <tr><td style="background:linear-gradient(135deg,#4f46e5,#0ea5e9);padding:26px 32px;">
        <div style="color:#ffffff;font-size:19px;font-weight:700;letter-spacing:-.3px;">AzTU Kanban</div>
        <div style="color:rgba(255,255,255,.82);font-size:12px;margin-top:4px;">Azerbaijan Technical University &middot; Task Management</div>
      </td></tr>
      <tr><td style="padding:30px 32px 8px 32px;color:#0f172a;">
        <div style="font-size:12px;font-weight:700;color:#4f46e5;letter-spacing:.06em;text-transform:uppercase;" th:text="${taskKey}">EDU-14</div>
        <h1 style="margin:6px 0 14px 0;font-size:20px;font-weight:700;line-height:1.35;" th:text="${title}">Task title</h1>
        <p style="margin:0 0 18px 0;font-size:14px;line-height:1.7;color:#475569;">
          Hello <strong th:text="${recipientName}">Name</strong>,
          <strong th:text="${actorName}">Someone</strong> moved this task forward.
        </p>
        <table cellpadding="0" cellspacing="0" style="width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:0 0 22px 0;">
          <tr><td style="font-size:13px;color:#64748b;padding:5px 0;">From</td>
              <td style="font-size:13px;color:#0f172a;font-weight:600;text-align:right;" th:text="${fromColumn}">To Do</td></tr>
          <tr><td style="font-size:13px;color:#64748b;padding:5px 0;">To</td>
              <td style="font-size:13px;color:#16a34a;font-weight:700;text-align:right;" th:text="${toColumn}">Done</td></tr>
        </table>
        <a th:href="${taskUrl}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;">Open the task</a>
      </td></tr>
      <tr><td style="padding:8px 32px 30px 32px;">
        <hr style="border:none;border-top:1px solid #e2e8f0;margin:22px 0;"/>
        <p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.6;">
          You are receiving this message because of your AzTU Kanban account.
          You can turn e-mail notifications off in your profile settings.
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>

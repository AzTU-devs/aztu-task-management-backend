spring:
  datasource:
    url: jdbc:h2:mem:kanban;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test-only-secret-key-long-enough-for-hmac-sha256-0123456789abcdef
    expiration-hours: 1
  mail:
    enabled: false
  seed:
    demo-data: true
  bootstrap:
    admins:
      - email: admin@aztu.edu.az
        password: "Admin123!"
        full-name: AzTU Administrator
      # a second slot, plus punctuation that shells and YAML like to mangle
      - email: Second.Admin@AzTU.edu.az
        password: "Sec0nd!&pass"
        full-name: Second Administrator
      # duplicate of the first entry - must be ignored, not applied twice
      - email: admin@aztu.edu.az
        password: "DifferentPassword1!"
        full-name: Duplicate
      # empty slot - must be skipped
      - email: ""
        password: ""
        full-name: Unused

logging:
  level:
    org.hibernate.SQL: WARN

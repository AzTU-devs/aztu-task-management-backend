services:
  db:
    image: postgres:16-alpine
    container_name: aztu-kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aztu_kanban}
      POSTGRES_USER: ${DB_USER:-aztu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aztu}
    volumes:
      - kanban_db_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aztu} -d ${DB_NAME:-aztu_kanban}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kanban

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aztu-kanban-api:latest
    container_name: aztu-kanban-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aztu_kanban}
      DB_USER: ${DB_USER:-aztu}
      DB_PASSWORD: ${DB_PASSWORD:-aztu}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@aztu.edu.az}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AzTU Kanban}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aztu.edu.az}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-AzTU Administrator}
      ADMIN2_EMAIL: ${ADMIN2_EMAIL:-}
      ADMIN2_PASSWORD: ${ADMIN2_PASSWORD:-}
      ADMIN2_FULL_NAME: ${ADMIN2_FULL_NAME:-AzTU Administrator}
      ADMIN3_EMAIL: ${ADMIN3_EMAIL:-}
      ADMIN3_PASSWORD: ${ADMIN3_PASSWORD:-}
      ADMIN3_FULL_NAME: ${ADMIN3_FULL_NAME:-AzTU Administrator}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - kanban

volumes:
  kanban_db_data:
    name: aztu_kanban_db_data

networks:
  kanban:
    name: aztu-kanban-net
    driver: bridge
